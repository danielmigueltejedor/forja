[package]
name = "forja-render"
description = "Forja rendering: display lists (linetypes, hatches, text, blocks, dimensions) and a CPU rasteriser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
forja-geom = { workspace = true }
forja-color = { workspace = true }
forja-doc = { workspace = true }
forja-fonts = { workspace = true }
tiny-skia = { workspace = true }
lyon_tessellation = { workspace = true }

# Display lists of large drawings are built on all cores (not on the web, which has no threads).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
