name: Deterministic Quality Gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hygiene
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git show --format= --check HEAD
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Changed Rust source formatting (no new formatting debt)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="HEAD^"
          fi
          changed=0
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]]; then
              rustfmt --check --edition 2021 "$file"
              changed=$((changed + 1))
            fi
          done < <(git diff --name-only --diff-filter=AM -z "$base" HEAD -- '*.rs')
          echo "Checked $changed changed Rust files; existing formatting debt remains tracked separately."
      - name: Cargo workspace and lockfile integrity
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
