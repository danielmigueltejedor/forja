name: AGENTS.md

# AGENTS.md follows Nodalia's template (getnodalia/foundation, standards/agents.md).
on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/agents.yml
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/agents.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    uses: getnodalia/foundation/.github/workflows/agents-check.yml@9178a270c5e577a822c5523d21b56efdd89fc1e1 # foundation main
