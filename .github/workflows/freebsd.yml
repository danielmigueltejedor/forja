# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

# The VM build is slow, so it runs nightly on main and on pushes to `release`, not on every pull
# request: a drifted dependency still shows up within a day, and always before a release ships.
# PRs that change the FreeBSD workflow or packaging itself still run it.
on:
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - packaging/env.sh
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    uses: getnodalia/foundation/.github/workflows/freebsd.yml@9178a270c5e577a822c5523d21b56efdd89fc1e1 # foundation main
    with:
      # FreeBSD 15.0's package repository now contains binaries requiring a newer libc than the
      # VM image. 15.1 keeps the base system and packages on the same ABI.
      release: "15.1"
      # Foundation's default list plus gtk3 and mesa-dri, as the inherited workflow installed:
      # mesa-dri carries the software Vulkan driver the GPU tests render with in the VM.
      packages: "libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs mesa-dri vulkan-loader gtk3 fontconfig freetype2 alsa-lib dejavu"
      fonts-repository: getnodalia/foundation
      fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
