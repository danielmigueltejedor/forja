# Structural rules for the command-line code (RFC-0012): lint/ast-grep's rule tests, then a scan.
# Seconds, no Rust build.
name: ast-grep

on:
  push:
    branches: [main]
    paths: ["lint/ast-grep/**", "apps/forja-cli/src/**", "apps/forja/src/launch_args.rs", "apps/forja/src/main.rs", ".github/workflows/ast-grep.yml"]
  pull_request:
    paths: ["lint/ast-grep/**", "apps/forja-cli/src/**", "apps/forja/src/launch_args.rs", "apps/forja/src/main.rs", ".github/workflows/ast-grep.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-grep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: getnodalia/foundation/.github/workflows/ast-grep.yml@9178a270c5e577a822c5523d21b56efdd89fc1e1 # foundation main
    with:
      config: lint/ast-grep/sgconfig.yml
      paths: apps/forja-cli/src apps/forja/src/launch_args.rs apps/forja/src/main.rs
