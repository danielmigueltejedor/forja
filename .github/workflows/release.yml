name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""
      skip-macos:
        description: "Draft the release without the macOS build when only that job failed (its larger runner is paid for)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Regenerates contributors/contributors.json for the release commit; every build bundles it.
  credits:
    permissions:
      contents: read
      pull-requests: read
    uses: storytold/craft-common-actions/.github/workflows/refresh-contributors.yml@main
  git-sources:
    name: Git dependencies come from storytold
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Git dependencies come from storytold
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          # Source replacement, patches and path overrides in cargo config never show up
          # in Cargo.lock. Parsed rather than grepped: TOML has many spellings of one key.
          # Cargo still reads the legacy .cargo/config.
          python3 - <<'PY'
          import os, sys, tomllib
          for path in (".cargo/config", ".cargo/config.toml"):
              if not os.path.exists(path):
                  continue
              config = tomllib.load(open(path, "rb"))
              replaced = [name for name, source in config.get("source", {}).items()
                          if isinstance(source, dict) and "replace-with" in source]
              if replaced or "patch" in config or "paths" in config:
                  print(f"{path} replaces, patches or overrides a source")
                  sys.exit(1)
          PY
          # Fails when Cargo.lock is out of date with the manifests.
          cargo metadata --locked --format-version 1 > /dev/null
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          bad = sorted({p["source"] for p in lock.get("package", [])
                        if p.get("source", "").startswith("git+")
                        and not p["source"].startswith(("git+https://github.com/storytold/",
                                                         "git+https://github.com/danielmigueltejedor/nodalia-design"))})
          if bad:
              print("Git dependencies outside github.com/storytold and nodalia-design:", *bad, sep="\n")
              sys.exit(1)
          PY

  release:
    needs: [git-sources, credits]
    permissions:
      # The reusable release workflow tags and uploads the draft release.
      contents: write
      packages: write
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-name: forja
      app-title: Forja
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      version: ${{ inputs.version }}
      contributors-artifact: ${{ needs.credits.outputs.artifact-name }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}

  # The shared release workflow only drafts when every platform built. When the macOS job alone
  # failed (its larger runner needs paid Actions minutes) and the run asked for it, draft from the
  # other platforms' artifacts in this run. Any other failed job still stops the draft.
  draft-without-macos:
    name: Draft GitHub Release without macOS
    needs: [release]
    if: ${{ !cancelled() && inputs.skip-macos && needs.release.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only the macOS build failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          failed="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest" \
            --jq '.jobs[] | select(.name | startswith("release / "))
                  | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
                  | .name')"
          echo "Failed release jobs:"
          echo "${failed:-  (none)}"
          if [ "$failed" != "release / macOS universal" ]; then
            echo "::error::Only the macOS build may fail for a draft without it."
            exit 1
          fi
      - id: v
        uses: storytold/craft-common-actions/actions/resolve-version@main
        with:
          input-version: ${{ inputs.version }}
          app-title: Forja
      - uses: storytold/craft-common-actions/actions/draft-release@main
        with:
          version: ${{ steps.v.outputs.version }}
          app-title: Forja
          prerelease: ${{ steps.v.outputs.prerelease }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
