[package]
name = "nodalia-theme"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Nodalia Design Language for Rust: design tokens as constants and an egui style built from them."
repository = "https://github.com/danielmigueltejedor/nodalia-design"
publish = false

[features]
default = []
# Builds `egui::Style` and `egui::Visuals` from the tokens. Without it the crate has no dependencies.
egui = ["dep:egui"]

[dependencies]
egui = { version = "0.37", default-features = false, optional = true }

# Standalone on purpose: apps take this crate as a git dependency into their own workspace.
[workspace]
